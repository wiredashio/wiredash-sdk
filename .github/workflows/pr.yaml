name: Pull Requests

on:
  pull_request:
  push:
    branches:
      - stable
      - beta
      - master

jobs:
  code_style:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    steps:
      - uses: actions/checkout@v3
      - name: Flutter version
        run: flutter doctor -v
      - name: Download dependencies
        run: ./wiresdk deps
      - name: Analyze
        run: ./wiresdk analyze --fatal-infos --fatal-warnings .
      - name: Check formatting
        run: ./wiresdk format --verify

  pr-min:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:3.19.0
    steps:
      - uses: actions/checkout@v3
      - name: Flutter version
        run: flutter doctor -v
      # Only resolve the wiredash package and the 3.19 sample; other examples
      # use Kotlin Gradle / Dart 3.4+ APIs that Flutter 3.19 can't process.
      - name: Download dependencies (wiredash)
        run: flutter pub get
      - name: Download dependencies (old_flutter_3_19_0)
        working-directory: examples/old_flutter_3_19_0
        run: flutter pub get
      - name: Test
        run: ./wiresdk test
      - name: Build
        working-directory: examples/old_flutter_3_19_0
        run: ./../../wiresdk flutter build web

  pr-stable:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    if: ${{ github.base_ref != 'beta' || github.base_ref == null && github.ref != 'beta' }}
    steps:
      - uses: actions/checkout@v3
      - name: Flutter version
        run: flutter doctor -v
      - name: Download dependencies
        run: ./wiresdk deps
      - name: Test
        run: ./wiresdk test
      - name: Build
        run: cd examples/theming && ./../../wiresdk flutter build web

  pr-stable-integration:
    # Run on Linux with Xvfb because the macOS-latest runners regularly
    # fail to foreground the test app ("Failed to foreground app; open
    # returned 1") and the job then hangs until the 6h default timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Flutter version
        run: flutter doctor -v
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - name: Download dependencies
        run: ./wiresdk deps
      - name: Run integration test
        timeout-minutes: 8
        working-directory: examples/theming
        run: xvfb-run -a ./../../wiresdk flutter test -d linux integration_test

  pr-beta:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:beta
    if: ${{ github.base_ref == 'beta' || github.base_ref == null && github.ref == 'beta' }}
    steps:
      - uses: actions/checkout@v3
      - name: Flutter version
        run: flutter doctor -v
      - name: Build
        run: cd examples/theming && ./../../wiresdk flutter build web
      - name: Download dependencies
        run: |
          # Override dependencies as long as we depend on checks 0.2.2
          ./wiresdk flutter pub add 'override:test_api:^0.7.0'
          ./wiresdk deps
      - name: Test
        run: ./wiresdk test
