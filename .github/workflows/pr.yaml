name: Pull Requests

on:
  pull_request:
  push:
    branches:
      - stable
      - beta
      - master

jobs:
  code_style:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    steps:
      - uses: actions/checkout@v3
      - name: Flutter version
        run: flutter doctor -v
      - name: Download dependencies
        run: ./wiresdk deps
      - name: Analyze
        run: ./wiresdk analyze --fatal-infos --fatal-warnings .
      - name: Check formatting
        run: ./wiresdk format --verify

  pr-min:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:3.19.0
    steps:
      - uses: actions/checkout@v3
      - name: Flutter version
        run: flutter doctor -v
      # Only resolve the wiredash package and the 3.19 sample; other examples
      # use Kotlin Gradle / Dart 3.4+ APIs that Flutter 3.19 can't process.
      - name: Download dependencies (wiredash)
        run: flutter pub get
      - name: Download dependencies (old_flutter_3_19_0)
        working-directory: examples/old_flutter_3_19_0
        run: flutter pub get
      - name: Test
        run: ./wiresdk test
      - name: Build
        working-directory: examples/old_flutter_3_19_0
        run: ./../../wiresdk flutter build web

  pr-stable:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    if: ${{ github.base_ref != 'beta' || github.base_ref == null && github.ref != 'beta' }}
    steps:
      - uses: actions/checkout@v3
      - name: Flutter version
        run: flutter doctor -v
      - name: Download dependencies
        run: ./wiresdk deps
      - name: Test
        run: ./wiresdk test
      - name: Build
        run: cd examples/theming && ./../../wiresdk flutter build web

  pr-stable-integration-macos:
    # Avoid macos-15: `flutter test -d macos` hits "Failed to foreground
    # app; open returned 1" and then hangs forever waiting for the
    # VM-service handshake.
    # See https://github.com/flutter/flutter/issues/176850
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Flutter version
        run: flutter doctor -v
      - name: Download dependencies
        run: ./wiresdk deps
      - name: Run integration test
        timeout-minutes: 10
        working-directory: examples/theming
        run: ./../../wiresdk flutter test -d macos integration_test

  pr-stable-integration-linux:
    # Runs the integration tests on Linux desktop, where shared_preferences
    # keeps a per-isolate cache. This guards the background-isolate analytics
    # path (events_on_isolate_test.dart) on the platform that exposed the bug.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - name: Flutter version
        run: flutter doctor -v
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Download dependencies
        run: ./wiresdk deps
      - name: Run integration test
        timeout-minutes: 10
        working-directory: examples/theming
        run: xvfb-run -a ./../../wiresdk flutter test -d linux integration_test

  pr-beta:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:beta
    if: ${{ github.base_ref == 'beta' || github.base_ref == null && github.ref == 'beta' }}
    steps:
      - uses: actions/checkout@v3
      - name: Flutter version
        run: flutter doctor -v
      - name: Build
        run: cd examples/theming && ./../../wiresdk flutter build web
      - name: Download dependencies
        run: |
          # Override dependencies as long as we depend on checks 0.2.2
          ./wiresdk flutter pub add 'override:test_api:^0.7.0'
          ./wiresdk deps
      - name: Test
        run: ./wiresdk test
